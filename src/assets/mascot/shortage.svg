<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 270" width="100%" height="100%" fill="none">
  <style>
    .svg-origin-center { transform-box: fill-box; transform-origin: center; }
    .svg-origin-bottom { transform-box: fill-box; transform-origin: bottom center; }
    @keyframes mascotBreathe { 0%, 100% { transform: translateY(0px) scaleY(1); } 50% { transform: translateY(-4px) scaleY(1.015); } }
    @keyframes eyeBlink { 0%, 44%, 48%, 94%, 98%, 100% { transform: scaleY(1); } 46%, 96% { transform: scaleY(0.08); } }
    @keyframes headIdle { 0%, 100% { transform: rotate(0deg) translateY(0px); } 50% { transform: rotate(1.2deg) translateY(-3px); } }
    @keyframes headListenTilt { 0%, 100% { transform: rotate(-6deg) translate(-3px, -2px); } 50% { transform: rotate(-8deg) translate(-4px, -5px); } }
    @keyframes headSuccessBounce { 0%, 100% { transform: translateY(0px); } 40% { transform: translateY(-7px); } }
    @keyframes headShockShake { 0%, 100% { transform: translateX(0px); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    @keyframes voiceWavePulse { 0% { transform: scale(0.85); opacity: 0.85; } 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes badgeFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes sweatDrop { 0% { transform: translateY(0px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(20px); opacity: 0; } }
    @keyframes hatSalute { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-9px) rotate(4deg); } }
    .anim-breathe { animation: mascotBreathe 3s ease-in-out infinite; }
    .anim-blink { animation: eyeBlink 4.5s ease-in-out infinite; }
    .anim-head-idle { animation: headIdle 3.2s ease-in-out infinite; }
    .anim-head-listen { animation: headListenTilt 2s ease-in-out infinite; }
    .anim-head-success { animation: headSuccessBounce 1.6s ease-in-out infinite; }
    .anim-head-shock { animation: headShockShake 0.65s ease-in-out infinite; }
    .anim-wave-1 { animation: voiceWavePulse 1.6s ease-out infinite; }
    .anim-wave-2 { animation: voiceWavePulse 1.6s ease-out 0.5s infinite; }
    .anim-float { animation: badgeFloat 2.2s ease-in-out infinite; }
    .anim-sweat { animation: sweatDrop 1.5s ease-in infinite; }
    .anim-hat-salute { animation: hatSalute 2.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="auraGrad_shortage" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="apronGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Soft Ambient Aura -->
  <circle cx="130" cy="145" r="112" fill="url(#auraGrad_shortage)"/>

  
          <!-- Crimson Alert Pulse -->
          <circle cx="130" cy="135" r="92" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="10 6" fill="none" class="anim-wave-1 svg-origin-center"/>
        

  <!-- MAIN BREATHING BODY GROUP -->
  <g class="anim-breathe svg-origin-bottom">

    <!-- Chef / Butcher White Coat Torso -->
    <path d="M72 252 C72 204 94 180 130 180 C166 180 188 204 188 252 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>

    <!-- Red Butcher Apron with Classic White Stripes -->
    <path d="M90 184 H170 L178 252 H82 L90 184 Z" fill="url(#apronGrad)"/>
    <line x1="108" y1="184" x2="105" y2="252" stroke="#FEE2E2" stroke-width="3" stroke-opacity="0.65"/>
    <line x1="130" y1="184" x2="130" y2="252" stroke="#FEE2E2" stroke-width="3" stroke-opacity="0.65"/>
    <line x1="152" y1="184" x2="155" y2="252" stroke="#FEE2E2" stroke-width="3" stroke-opacity="0.65"/>

    <!-- Butcher Neck Scarf / Neckerchief -->
    <path d="M102 178 Q130 196 158 178 L148 198 Q130 205 112 198 Z" fill="#0F172A"/>
    <circle cx="130" cy="194" r="6" fill="#10B981"/>

    <!-- Digital Scale Chest Pocket Badge -->
    <rect x="112" y="212" width="36" height="22" rx="6" fill="#0F172A" stroke="#F8FAFC" stroke-width="1.8"/>
    <circle cx="130" cy="223" r="6" fill="#10B981"/>
    <path d="M130 223 L133 219" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

    <!-- Dynamic Arms & State Props -->
    
          <!-- Hands raised in alert -->
          <path d="M78 192 Q50 170 60 144" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" fill="none"/>
          <circle cx="60" cy="142" r="10" fill="#FDBA74"/>
          <path d="M182 192 Q210 170 200 144" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" fill="none"/>
          <circle cx="200" cy="142" r="10" fill="#FDBA74"/>
          <!-- Shaking Warning Triangle Badge -->
          <g class="anim-head-shock svg-origin-center">
            <path d="M202 96 L228 142 H176 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
            <text x="202" y="135" text-anchor="middle" fill="#FFFFFF" font-weight="900" font-size="22">!</text>
          </g>
          <!-- Animated Sweat Drop on Temple -->
          <path d="M88 106 C88 106 82 116 82 120 C82 123.5 84.7 126 88 126 C91.3 126 94 123.5 94 120 C94 116 88 106 88 106 Z" fill="#38BDF8" class="anim-sweat svg-origin-center"/>
        

    <!-- ANIMATED HEAD & CHEF HAT GROUP -->
    <g class="anim-head-shock svg-origin-bottom">

      <!-- Ears -->
      <circle cx="80" cy="134" r="11" fill="#FDBA74" stroke="#EA580C" stroke-width="1.5"/>
      <circle cx="180" cy="134" r="11" fill="#FDBA74" stroke="#EA580C" stroke-width="1.5"/>

      <!-- Head Base -->
      <rect x="84" y="88" width="92" height="90" rx="42" fill="url(#skinGrad)" stroke="#EA580C" stroke-width="2"/>

      <!-- Warm Rosy Cheeks -->
      <ellipse cx="97" cy="140" rx="8" ry="5" fill="#F87171" fill-opacity="0.45"/>
      <ellipse cx="163" cy="140" rx="8" ry="5" fill="#F87171" fill-opacity="0.45"/>

      <!-- Eyebrows -->
      
          <path d="M96 118 Q108 110 119 107" stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M141 107 Q152 110 164 118" stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none"/>
        

      <!-- Expressive Eyes -->
      
          <g>
            <circle cx="109" cy="128" r="9.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
            <circle cx="109" cy="128" r="4.2" fill="#0F172A"/>
            <circle cx="107.5" cy="126.5" r="1.5" fill="#FFFFFF"/>
            <circle cx="151" cy="128" r="9.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
            <circle cx="151" cy="128" r="4.2" fill="#0F172A"/>
            <circle cx="149.5" cy="126.5" r="1.5" fill="#FFFFFF"/>
          </g>
        

      <!-- Friendly Rounded Nose -->
      <ellipse cx="130" cy="136" rx="7.5" ry="6" fill="#FB923C"/>

      <!-- Mouth -->
      
          <ellipse cx="130" cy="160" rx="8" ry="6" fill="#7F1D1D"/>
          <path d="M124 157 H136" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
        

      <!-- Signature Master Butcher Handlebar Mustache (شنب المعلم ميزان) -->
      <g class="anim-mustache-worried svg-origin-center">
        <path d="M130 145 C116 142 104 154 93 150 C88 148 87 142 92 141 C97 140 100 145 107 143 C115 140 122 138 130 141 C138 138 145 140 153 143 C160 145 163 140 168 141 C173 142 172 148 167 150 C156 154 144 142 130 145 Z" fill="#1E293B"/>
      </g>

      <!-- Master Chef / Butcher Toque Hat -->
      <g class=" svg-origin-bottom">
        <path d="M84 78 C68 74 68 44 92 42 C98 24 122 20 130 28 C138 20 162 24 168 42 C192 44 192 74 176 78 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5"/>
        <!-- Hat Band with Smart Scale Accent -->
        <rect x="84" y="74" width="92" height="18" rx="6" fill="#0F172A"/>
        <rect x="84" y="81" width="92" height="5" fill="#10B981"/>
        <!-- Mini Scale Icon on Hat Center -->
        <circle cx="130" cy="83" r="9" fill="#0F172A" stroke="#FFFFFF" stroke-width="2"/>
        <path d="M126 84 L129 87 L135 80" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

    </g>
  </g>

  <!-- Base Weighing Platform Pedestal -->
  <ellipse cx="130" cy="254" rx="74" ry="8" fill="#0F172A" fill-opacity="0.35"/>
</svg>
